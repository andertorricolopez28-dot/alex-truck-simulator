
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALEX TRUCK SIMULATOR 3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial;touch-action:none}
#game{position:fixed;inset:0}
.panel{background:#071711eF;border:1px solid #39e6a3;border-radius:12px;padding:9px}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
#brand{color:#48ffb8;font-weight:bold;font-size:13px}
#stats{text-align:right;font-size:12px;line-height:1.5}
#speed{font-size:24px;font-weight:bold}
#buttons{position:fixed;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end}
.group{display:flex;gap:7px;align-items:end}
button{background:#071b17ed;color:white;border:1px solid #40e6a5;border-radius:12px;font-weight:bold;padding:12px;touch-action:none}
.control{width:62px;height:62px;border-radius:50%;font-size:23px}
.pedal{width:70px;height:65px;font-size:11px}
.small{font-size:10px;padding:9px}
#camera{position:fixed;top:83px;right:9px}
#extras{position:fixed;top:83px;left:9px;display:flex;gap:5px}
#menu{position:fixed;inset:0;background:#06110ef5;display:flex;align-items:center;justify-content:center;padding:16px}
#card{width:min(390px,100%);text-align:center}
h1{color:#45ffb8}
select{width:100%;padding:14px;background:#102720;color:white;border:1px solid #40e6a5;border-radius:10px;margin:12px 0}
#start{width:100%;padding:16px;background:#087b56}
#message{position:fixed;top:48%;left:50%;transform:translate(-50%,-50%);background:#071b17;padding:12px;border:1px solid #40e6a5;border-radius:10px;display:none}
#bars{position:fixed;left:10px;top:145px;font-size:11px;line-height:2}
.bar{width:105px;height:7px;background:#333;border-radius:8px;overflow:hidden}
.fill{height:100%;background:#38e69d;width:100%}
#gearbox{position:fixed;right:10px;bottom:95px;display:flex;gap:5px}
</style>
</head>
<body>
<div id="game"></div>

<div id="top">
 <div class="panel">
  <div id="brand">ALEX TRUCK SIMULATOR 3.0</div>
  <small id="truckName">SCANIA R</small>
 </div>
 <div class="panel" id="stats">
  <div id="speed">0 KM/H</div>
  <div id="gear">MARCHA N</div>
  <div id="clock">DÍA 08:00</div>
 </div>
</div>

<div id="extras">
 <button class="small" id="lights">💡 LUCES</button>
 <button class="small" id="weather">🌧️ LLUVIA</button>
</div>
<button id="camera">📷 CÁMARA</button>

<div id="bars">
 <div>COMBUSTIBLE</div><div class="bar"><div class="fill" id="fuelbar"></div></div>
 <div>ESTADO DEL CAMIÓN</div><div class="bar"><div class="fill" id="healthbar"></div></div>
</div>

<div id="gearbox">
 <button class="small" id="gearDown">−</button>
 <button class="small" id="gearUp">+</button>
</div>

<div id="buttons">
 <div class="group">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <div class="group">
  <button class="pedal" id="brake">FRENO</button>
  <button class="pedal" id="gas">ACELERAR</button>
 </div>
</div>

<div id="message"></div>

<div id="menu">
 <div class="panel" id="card">
  <h1>🚛 ALEX TRUCK</h1>
  <p>SIMULADOR DE CAMIONES 3D</p>
  <p>Selecciona tu camión</p>
  <select id="truck">
   <option>Scania R</option>
   <option>Volvo FH</option>
   <option>Mercedes-Benz Actros</option>
  </select>
  <button id="start">INICIAR VIAJE</button>
  <p><small>VERSIÓN 3.0 · BRASIL</small></p>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c6df);
scene.fog=new THREE.Fog(0x91c6df,100,800);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('game').appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xffffff,0x526d43,1.8);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-50,100,40);
sun.castShadow=true;
scene.add(sun);

const mat=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({
 color:c,roughness:r,metalness:m
});
const black=mat(0x15191c),rubber=mat(0x090b0d);
const metal=mat(0x9da8ad,.35,.8),chrome=mat(0xd9e1e4,.22,.9);
const glass=mat(0x173c4c,.2,.2),road=mat(0x30363a);
const grass=mat(0x477c42),yellow=mat(0xffd34e);
const white=mat(0xf2f0e9),red=mat(0xb71c1c);

function cube(parent,w,h,d,material,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;
 parent.add(o);return o;
}
function cyl(parent,r,l,material,x,y,z,rot){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,l,20),material);
 o.position.set(x,y,z);
 if(rot)o.rotation.set(rot.x,rot.y,rot.z);
 o.castShadow=true;parent.add(o);return o;
}
function wheel(parent,x,y,z){
 cyl(parent,.57,.42,rubber,x,y,z,{x:0,y:0,z:Math.PI/2});
 cyl(parent,.3,.44,metal,x,y,z,{x:0,y:0,z:Math.PI/2});
 cyl(parent,.12,.46,chrome,x,y,z,{x:0,y:0,z:Math.PI/2});
}

// Mundo
cube(scene,260,.3,2400,grass,0,-.35,-850);
cube(scene,18,.15,2400,road,0,-.12,-850);
for(let z=150;z>-2100;z-=24)cube(scene,.16,.035,9,yellow,0,-.02,z);

for(const side of [-1,1]){
 for(let z=100;z>-2000;z-=32){
  const x=side*(17+Math.random()*55);
  if(Math.random()>.3){
   cyl(scene,.22,3,mat(0x654329),x,1.5,z);
   const tree=new THREE.Mesh(new THREE.ConeGeometry(3,7,8),mat(0x24623b));
   tree.position.set(x,6,z);scene.add(tree);
  }else{
   cube(scene,6,6+Math.random()*10,6,mat(0xc8b6a1),x,3,z);
  }
 }
}

// Camión
const truck=new THREE.Group();scene.add(truck);
let wheels=[];
function buildTruck(name){
 truck.clear();wheels=[];
 const color=name.includes('Volvo')?0x174f9c:
 name.includes('Mercedes')?0xe8e8e8:0xc62828;
 const paint=mat(color,.35,.3);

 cube(truck,2.5,.55,9,black,0,1,1);
 cube(truck,2.1,.22,8,metal,0,1.35,1);

 // Remolque
 cube(truck,2.85,3.35,7.4,white,0,3.1,3.8);
 cube(truck,2.9,.15,7.5,metal,0,1.45,3.8);
 for(const side of [-1,1]){
  for(let y=1.65;y<4.7;y+=.35)
   cube(truck,.035,.035,7.25,metal,side*1.44,y,3.8);
 }

 // Cabina
 cube(truck,2.65,2.75,2.7,paint,0,2.45,-3.2);
 cube(truck,2.35,1.05,.08,glass,0,2.85,-4.58);
 cube(truck,2.7,.18,2.8,paint,0,3.87,-3.2);
 cube(truck,2.75,.18,.5,black,0,3.7,-4.55);

 for(const side of [-1,1]){
  cube(truck,.07,1.05,1.45,glass,side*1.34,2.9,-3.15);
  cube(truck,.12,.55,.15,black,side*1.48,2.85,-4);
  cube(truck,.22,.3,.18,chrome,side*1.55,3.05,-4);
 }

 // Parrilla
 cube(truck,1.35,.9,.09,black,0,1.75,-4.64);
 for(let y=1.42;y<2.12;y+=.16)
  cube(truck,1.28,.035,.11,chrome,0,y,-4.71);
 cube(truck,2.75,.35,.3,metal,0,.85,-4.65);

 for(const side of [-1,1]){
  cube(truck,.42,.42,.12,white,side*1.02,1.55,-4.68);
  cube(truck,.16,.16,.13,yellow,side*1.02,1.15,-4.7);
  cyl(truck,.32,1.5,metal,side*1.28,1.05,-.6,{x:0,y:0,z:Math.PI/2});
  cyl(truck,.11,2,chrome,side*1.25,2.2,-1.7);
 }

 for(const z of [-3.2,1.5,4.7]){
  for(const side of [-1,1]){
   wheel(truck,side*1.4,.65,z);
   if(z>0)wheel(truck,side*1.72,.65,z);
  }
 }
}
buildTruck('Scania R');

// Tráfico
const cars=[];
for(let i=0;i<8;i++){
 const car=new THREE.Group();
 const paint=mat([0xe9e9e9,0x245c9d,0xbba13b,0x333333][i%4]);
 cube(car,1.7,.7,3,paint,0,.75,0);
 cube(car,1.35,.65,1.3,glass,0,1.3,-.2);
 car.position.set(i%2?3.3:-3.3,0,-90-i*110);
 scene.add(car);cars.push(car);
}

// Tablero interior
const dashboard=new THREE.Group();
camera.add(dashboard);
cube(dashboard,2.7,.3,.8,black,0,-.82,-1.25);
cube(dashboard,1.1,.25,.06,mat(0x1c6c58),0,-.62,-1.65);
const steering=new THREE.Mesh(new THREE.TorusGeometry(.34,.045,10,36),black);
steering.position.set(0,-.55,-.85);
dashboard.add(steering);

// Luces delanteras
const headLights=[];
for(const x of [-.9,.9]){
 const light=new THREE.SpotLight(0xffffff,0,90,.45,.5,1);
 light.position.set(x,1.8,-4.8);
 light.target.position.set(x,0,-30);
 truck.add(light);truck.add(light.target);headLights.push(light);
}

// Lluvia
const rainCount=900;
const rainGeo=new THREE.BufferGeometry();
const rainPositions=new Float32Array(rainCount*3);
for(let i=0;i<rainCount;i++){
 rainPositions[i*3]=(Math.random()-.5)*45;
 rainPositions[i*3+1]=Math.random()*35;
 rainPositions[i*3+2]=(Math.random()-.5)*100;
}
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPositions,3));
const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({
 color:0xb9d9ed,size:.12
}));
scene.add(rain);rain.visible=false;

let speed=0,steer=0,camMode=0,playing=false;
let fuel=100,health=100,gear=1,lightsOn=false,raining=false;
let gameTime=8;
const input={left:false,right:false,gas:false,brake:false};

function hold(id,key){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();input[key]=true;
  el.setPointerCapture(e.pointerId);
 });
 for(const ev of ['pointerup','pointercancel','lostpointercapture'])
  el.addEventListener(ev,()=>input[key]=false);
}
hold('left','left');hold('right','right');
hold('gas','gas');hold('brake','brake');

function notify(t){
 const el=document.getElementById('message');
 el.textContent=t;el.style.display='block';
 setTimeout(()=>el.style.display='none',1300);
}

document.getElementById('start').onclick=()=>{
 const name=document.getElementById('truck').value;
 buildTruck(name);
 document.getElementById('truckName').textContent=name.toUpperCase();
 document.getElementById('menu').style.display='none';
 playing=true;notify('¡Buen viaje!');
};

document.getElementById('camera').onclick=()=>{
 camMode=1-camMode;
 dashboard.visible=camMode===1;
 notify(camMode?'Cámara interior':'Cámara exterior');
};

document.getElementById('lights').onclick=()=>{
 lightsOn=!lightsOn;
 headLights.forEach(l=>l.intensity=lightsOn?5:0);
 notify(lightsOn?'Luces encendidas':'Luces apagadas');
};

document.getElementById('weather').onclick=()=>{
 raining=!raining;rain.visible=raining;
 notify(raining?'Lluvia activada':'Lluvia desactivada');
};

document.getElementById('gearUp').onclick=()=>{
 gear=Math.min(12,gear+1);notify('Marcha '+gear);
};
document.getElementById('gearDown').onclick=()=>{
 gear=Math.max(1,gear-1);notify('Marcha '+gear);
};

addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')input.left=true;
 if(e.key==='ArrowRight')input.right=true;
 if(e.key==='ArrowUp')input.gas=true;
 if(e.key==='ArrowDown')input.brake=true;
});
addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft')input.left=false;
 if(e.key==='ArrowRight')input.right=false;
 if(e.key==='ArrowUp')input.gas=false;
 if(e.key==='ArrowDown')input.brake=false;
});

const clock=new THREE.Clock();
let lastCollision=0;

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(playing){
  if(input.gas&&fuel>0&&health>0){
   speed+=12*dt*(.6+gear*.08);
   fuel-=.018*dt;
  }else speed-=2*dt;
  if(input.brake)speed-=30*dt;
  speed=THREE.MathUtils.clamp(speed,0,130);

  // Dirección corregida
  if(input.left)steer-=2.2*dt;
  if(input.right)steer+=2.2*dt;
  if(!input.left&&!input.right)steer*=Math.pow(.05,dt);
  steer=THREE.MathUtils.clamp(steer,-1,1);

  truck.position.x+=steer*speed*.012*dt*10;
  truck.position.x=THREE.MathUtils.clamp(truck.position.x,-5.5,5.5);
  truck.position.z-=speed*.12*dt;
  truck.rotation.y=steer*.12;

  steering.rotation.z=-steer*.65;

  cars.forEach(car=>{
   car.position.z+=speed*.12*dt+dt*2;
   if(car.position.z>truck.position.z+20){
    car.position.z=truck.position.z-850-Math.random()*200;
   }
   const dx=Math.abs(car.position.x-truck.position.x);
   const dz=Math.abs(car.position.z-truck.position.z);
   if(dx<2.1&&dz<4&&speed>10){
    speed*=.94;
    health=Math.max(0,health-.15);
   }
  });

  // Daños al salirse de la carretera
  if(Math.abs(truck.position.x)>5.1&&speed>20){
   health=Math.max(0,health-.05);
  }

  gameTime=(gameTime+dt*.025)%24;
  const hour=Math.floor(gameTime);
  const minute=Math.floor((gameTime-hour)*60);
  document.getElementById('clock').textContent=
   (hour<18&&hour>=6?'DÍA ':'NOCHE ')+
   String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');

  const night=hour<6||hour>=19;
  scene.background.set(night?0x101b35:0x91c6df);
  scene.fog.color.set(night?0x101b35:0x91c6df);
  hemi.intensity=night?.35:1.8;
  sun.intensity=night?.15:2;

  if(raining){
   const p=rain.geometry.attributes.position;
   for(let i=0;i<rainCount;i++){
    p.array[i*3+1]-=25*dt;
    p.array[i*3+2]+=speed*.12*dt;
    if(p.array[i*3+1]<0){
     p.array[i*3+1]=35;
     p.array[i*3+2]=(Math.random()-.5)*100;
    }
   }
   p.needsUpdate=true;
  }

  document.getElementById('speed').textContent=Math.round(speed)+' KM/H';
  document.getElementById('gear').textContent='MARCHA '+gear;
  document.getElementById('fuelbar').style.width=Math.max(0,fuel)+'%';
  document.getElementById('healthbar').style.width=health+'%';
  document.getElementById('fuelbar').style.background=fuel<20?'#ff4444':'#38e69d';
  if(fuel<=0&&speed<1)notify('Sin combustible');
  if(health<=0&&speed<1)notify('Camión averiado');
 }

 if(camMode===0){
  camera.position.set(truck.position.x,truck.position.y+7,truck.position.z+14);
  camera.lookAt(truck.position.x,2,truck.position.z-7);
 }else{
  camera.position.set(truck.position.x,truck.position.y+3.8,truck.position.z-3.5);
  camera.lookAt(truck.position.x,3.8,truck.position.z-30);
 }

 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
