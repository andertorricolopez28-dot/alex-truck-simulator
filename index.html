
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALEX TRUCK SIMULATOR</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#9ac8df;color:white;font-family:Arial;touch-action:none}
#game{position:fixed;inset:0}
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#071511df;border:1px solid #39e6a3;border-radius:12px;padding:9px}
#logo{font-weight:900;color:#4dffc0;font-size:13px}
#speed{text-align:right;font-size:24px;font-weight:bold}
#speed small{font-size:10px}
#buttons{position:fixed;bottom:15px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}
.group{display:flex;gap:8px}
button{color:white;background:#071b17ed;border:1px solid #40e6a5;border-radius:13px;padding:13px;font-weight:bold;touch-action:none}
.control{width:62px;height:62px;border-radius:50%;font-size:22px}
.pedal{height:66px;width:70px;font-size:11px}
#camera{position:fixed;top:65px;right:10px}
#menu{position:fixed;inset:0;background:#06110ef2;display:flex;align-items:center;justify-content:center;padding:18px}
#card{width:min(390px,100%);text-align:center}
h1{color:#45ffb8}
select{width:100%;padding:14px;background:#102720;color:white;border:1px solid #40e6a5;border-radius:10px;margin:12px 0}
#start{width:100%;padding:16px;background:#087b56}
#message{position:fixed;top:48%;left:50%;transform:translate(-50%,-50%);background:#071b17;padding:12px;border:1px solid #40e6a5;border-radius:10px;display:none}
</style>
</head>
<body>
<div id="game"></div>

<div id="top">
 <div class="panel">
  <div id="logo">ALEX TRUCK SIMULATOR</div>
  <small id="truckName">SCANIA R</small>
 </div>
 <div class="panel" id="speed">0 <small>KM/H</small><br><small id="gear">MARCHA N</small></div>
</div>

<button id="camera">📷 CÁMARA</button>

<div id="buttons">
 <div class="group">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <div class="group">
  <button class="pedal" id="brake">FRENO</button>
  <button class="pedal" id="gas">ACELERAR</button>
 </div>
</div>

<div id="message"></div>

<div id="menu">
 <div class="panel" id="card">
  <h1>🚛 ALEX TRUCK</h1>
  <p>SIMULADOR DE CAMIONES 3D</p>
  <p>Selecciona tu camión:</p>
  <select id="truck">
   <option>Scania R</option>
   <option>Volvo FH</option>
   <option>Mercedes-Benz Actros</option>
  </select>
  <button id="start">INICIAR VIAJE</button>
  <p><small>Versión 2.0 · Prototipo 3D</small></p>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c6df);
scene.fog=new THREE.Fog(0x91c6df,120,850);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526d43,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-50,100,40);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=(color,roughness=.75,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

const black=mat(0x15191c);
const rubber=mat(0x090b0d);
const metal=mat(0x9da8ad,.35,.8);
const chrome=mat(0xd9e1e4,.22,.9);
const glass=new THREE.MeshStandardMaterial({
 color:0x173c4c,roughness:.18,metalness:.25
});
const road=mat(0x30363a);
const grass=mat(0x477c42);
const yellow=mat(0xffd34e);
const white=mat(0xf2f0e9);
const red=mat(0xb71c1c);

function cube(parent,w,h,d,material,x,y,z){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

function cylinder(parent,radius,length,material,x,y,z,rotation){
 const mesh=new THREE.Mesh(
  new THREE.CylinderGeometry(radius,radius,length,24),material
 );
 mesh.position.set(x,y,z);
 if(rotation)mesh.rotation.set(rotation.x,rotation.y,rotation.z);
 mesh.castShadow=true;
 parent.add(mesh);
 return mesh;
}

function wheel(parent,x,y,z){
 const tire=cylinder(parent,.59,.43,rubber,x,y,z,{x:0,y:0,z:Math.PI/2});
 cylinder(parent,.31,.45,metal,x,y,z,{x:0,y:0,z:Math.PI/2});
 cylinder(parent,.13,.47,chrome,x,y,z,{x:0,y:0,z:Math.PI/2});
 return tire;
}

// Carretera y terreno
cube(scene,260,.3,2400,grass,0,-.35,-850);
cube(scene,18,.15,2400,road,0,-.12,-850);

for(let z=150;z>-2050;z-=24){
 cube(scene,.16,.035,9,yellow,0,-.02,z);
}

for(const side of [-1,1]){
 for(let z=100;z>-2000;z-=32){
  const x=side*(17+Math.random()*55);
  if(Math.random()>.3){
   cylinder(scene,.22,3,mat(0x654329),x,1.5,z);
   const crown=new THREE.Mesh(
    new THREE.ConeGeometry(3,7,8),mat(0x24623b)
   );
   crown.position.set(x,6,z);
   crown.castShadow=true;
   scene.add(crown);
  }else{
   cube(scene,6,5+Math.random()*12,6,
    mat([0xd6d0bb,0xc8b6a1,0xb6c5c8][Math.floor(Math.random()*3)]),
    x,3,z);
  }
 }
}

// Camión
const truck=new THREE.Group();
scene.add(truck);
let wheels=[];
let cabColor=0xc62828;

function buildTruck(name){
 truck.clear();
 wheels=[];

 cabColor=name.includes('Volvo')?0x174f9c:
 name.includes('Mercedes')?0xe8e8e8:0xc62828;

 const paint=mat(cabColor,.35,.35);

 // Chasis
 cube(truck,2.5,.55,9,black,0,1,1);
 cube(truck,2.1,.22,8,metal,0,1.35,1);

 // Remolque
 cube(truck,2.85,3.35,7.4,white,0,3.1,3.8);
 cube(truck,2.9,.15,7.5,metal,0,1.45,3.8);

 // Líneas laterales del remolque
 for(let side of [-1,1]){
  for(let y=1.65;y<4.7;y+=.35){
   cube(truck,.035,.035,7.25,metal,side*1.44,y,3.8);
  }
 }

 // Parte trasera del remolque
 cube(truck,2.9,3.35,.12,white,0,3.1,7.55);
 cube(truck,2.8,.15,.15,red,0,1.5,7.65);

 // Cabina
 cube(truck,2.65,2.75,2.7,paint,0,2.45,-3.2);
 cube(truck,2.35,1.05,.08,glass,0,2.85,-4.58);
 cube(truck,2.35,.12,.12,black,0,2.22,-4.62);

 // Ventanas laterales
 for(let side of [-1,1]){
  cube(truck,.07,1.05,1.45,glass,side*1.34,2.9,-3.15);
  cube(truck,.12,.18,1.4,black,side*1.38,3.55,-3.15);

  // Espejos
  cube(truck,.12,.55,.15,black,side*1.48,2.85,-4);
  cube(truck,.22,.3,.18,chrome,side*1.55,3.05,-4);
 }

 // Techo y visera
 cube(truck,2.7,.18,2.8,paint,0,3.87,-3.2);
 cube(truck,2.75,.18,.5,black,0,3.7,-4.55);

 // Parrilla delantera
 cube(truck,1.35,.9,.09,black,0,1.75,-4.64);
 for(let y=1.42;y<2.12;y+=.16){
  cube(truck,1.28,.035,.11,chrome,0,y,-4.71);
 }

 // Emblema frontal
 const emblem=name.includes('Volvo')?0x8ab5df:
 name.includes('Mercedes')?0xffffff:0xd8d8d8;
 cylinder(truck,.2,.08,mat(emblem,.3,.7),0,2.1,-4.78,{x:Math.PI/2,y:0,z:0});

 // Parachoques
 cube(truck,2.75,.35,.3,metal,0,.85,-4.65);
 cube(truck,2.3,.13,.12,black,0,.62,-4.7);

 // Faros
 for(const side of [-1,1]){
  cube(truck,.42,.42,.12,white,side*1.02,1.55,-4.68);
  cube(truck,.16,.16,.13,yellow,side*1.02,1.15,-4.7);

  // Depósitos laterales
  cylinder(truck,.32,1.5,metal,side*1.28,1.05,-.6,{x:0,y:0,z:Math.PI/2});

  // Escapes
  cylinder(truck,.11,2,chrome,side*1.25,2.2,-1.7);
 }

 // Luces superiores
 for(let x=-1;x<=1;x+=.5){
  cylinder(truck,.09,.12,yellow,x,4,-3.4,{x:Math.PI/2,y:0,z:0});
 }

 // Ruedas delanteras y traseras dobles
 for(const z of [-3.2,1.5,4.7]){
  for(const side of [-1,1]){
   wheels.push(wheel(truck,side*1.4,.65,z));
   if(z>0){
    wheels.push(wheel(truck,side*1.72,.65,z));
   }
  }
 }

 // Guardabarros
 for(const side of [-1,1]){
  cube(truck,.12,.22,2.1,black,side*1.42,1.15,3.1);
 }
}

buildTruck('Scania R');

// Tráfico
const cars=[];
for(let i=0;i<8;i++){
 const car=new THREE.Group();
 const color=mat([0xe9e9e9,0x245c9d,0xbba13b,0x333333][i%4]);
 cube(car,1.7,.7,3,color,0,.75,0);
 cube(car,1.35,.65,1.3,glass,0,1.3,-.2);
 for(const x of [-.8,.8]){
  for(const z of [-.9,.9])wheel(car,x,.4,z);
 }
 car.position.set(i%2?3.3:-3.3,0,-90-i*110);
 scene.add(car);
 cars.push(car);
}

// Interior de cabina unido a la cámara
const dashboard=new THREE.Group();
camera.add(dashboard);
cube(dashboard,2.7,.3,.8,black,0,-.82,-1.25);
cube(dashboard,1.1,.25,.06,mat(0x1c6c58),0,-.62,-1.65);

const steering=new THREE.Mesh(
 new THREE.TorusGeometry(.34,.045,10,36),black
);
steering.position.set(0,-.55,-.85);
dashboard.add(steering);

const interiorText=cube(dashboard,.5,.12,.04,mat(0x40ffb0),0,-.6,-1.7);

let speed=0,steer=0,camMode=0,playing=false;
const input={left:false,right:false,gas:false,brake:false};

function hold(id,key){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  input[key]=true;
  el.setPointerCapture(e.pointerId);
 });
 for(const ev of ['pointerup','pointercancel','lostpointercapture']){
  el.addEventListener(ev,e=>{
   input[key]=false;
  });
 }
}
hold('left','left');
hold('right','right');
hold('gas','gas');
hold('brake','brake');

document.getElementById('camera').onclick=()=>{
 camMode=1-camMode;
 dashboard.visible=camMode===1;
 notify(camMode?'Cámara interior':'Cámara exterior');
};

document.getElementById('start').onclick=()=>{
 const name=document.getElementById('truck').value;
 buildTruck(name);
 document.getElementById('truckName').textContent=name.toUpperCase();
 document.getElementById('menu').style.display='none';
 playing=true;
 dashboard.visible=false;
 notify('¡Buen viaje!');
};

function notify(text){
 const el=document.getElementById('message');
 el.textContent=text;
 el.style.display='block';
 setTimeout(()=>el.style.display='none',1400);
}

addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')input.left=true;
 if(e.key==='ArrowRight')input.right=true;
 if(e.key==='ArrowUp')input.gas=true;
 if(e.key==='ArrowDown')input.brake=true;
});
addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft')input.left=false;
 if(e.key==='ArrowRight')input.right=false;
 if(e.key==='ArrowUp')input.gas=false;
 if(e.key==='ArrowDown')input.brake=false;
});

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(playing){
  if(input.gas)speed+=17*dt;
  else speed-=2.2*dt;
  if(input.brake)speed-=32*dt;
  speed=THREE.MathUtils.clamp(speed,0,130);

  if(input.left)steer+=2.2*dt;
  if(input.right)steer-=2.2*dt;
  if(!input.left&&!input.right)steer*=Math.pow(.05,dt);
  steer=THREE.MathUtils.clamp(steer,-1,1);

  truck.position.x+=steer*speed*.012*dt*10;
  truck.position.x=THREE.MathUtils.clamp(truck.position.x,-5.5,5.5);
  truck.position.z-=speed*.12*dt;
  truck.rotation.y=steer*.12;

  wheels.forEach(w=>w.rotation.x-=speed*.04*dt);

  steering.rotation.z=-steer*.65;

  cars.forEach(car=>{
   car.position.z+=speed*.12*dt+dt*2;
   if(car.position.z>truck.position.z+20){
    car.position.z=truck.position.z-850-Math.random()*200;
   }
  });

  document.getElementById('speed').innerHTML=
   Math.round(speed)+' <small>KM/H</small><br><small>MARCHA '+
   (speed<1?'N':speed<30?'1':speed<60?'2':speed<90?'3':'4')+
   '</small>';
 }

 if(camMode===0){
  camera.position.set(truck.position.x,truck.position.y+7,truck.position.z+14);
  camera.lookAt(truck.position.x,2,truck.position.z-7);
 }else{
  camera.position.set(truck.position.x,truck.position.y+3.8,truck.position.z-3.5);
  camera.lookAt(truck.position.x,3.8,truck.position.z-30);
 }

 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
